name: Youngrok Job Radar

on:
  workflow_dispatch:
  schedule:
    # Sunday-Thursday 23:25 UTC = Monday-Friday 08:25 KST
    - cron: "25 23 * * 0-4"

concurrency:
  group: youngrok-job-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: youngrok-job-radar
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_INTERACTIVE: "false"
      ENABLED_COLLECTORS: remember
      DATABASE_URL: sqlite:///data/jobs.db
      HEADLESS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youngrok-job-radar/requirements.txt

      # ponytail: Actions cache is best-effort; use a hosted DB if durable history is required.
      - name: Restore job history
        uses: actions/cache/restore@v4
        with:
          path: youngrok-job-radar/data/jobs.db
          key: job-radar-db-${{ github.run_id }}
          restore-keys: job-radar-db-

      - name: Install dependencies
        run: pip install -e .

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Collect, analyze, and send
        run: python -m job_radar run

      - name: Save job history
        if: ${{ always() && hashFiles('youngrok-job-radar/data/jobs.db') != '' }}
        uses: actions/cache/save@v4
        with:
          path: youngrok-job-radar/data/jobs.db
          key: job-radar-db-${{ github.run_id }}
