[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "youngrok-job-radar"
version = "0.1.0"
description = "검증된 디자인 채용공고를 매일 텔레그램으로 보내는 개인 채용 레이더"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "APScheduler>=3.11,<4",
  "beautifulsoup4>=4.12,<5",
  "openai>=2.20,<3",
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
job-radar = "job_radar.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["job_radar"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
